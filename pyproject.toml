[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ndr"
version = "0.1.0"
description = "Neuroscience Data Reader - Python implementation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "VH-Lab", email = "vhlab@brandeis.edu"}]
maintainers = [{name = "Waltham Data Science"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    # PyYAML is a transitive dep on Python 3.11/3.12 (pulled in by matplotlib
    # + friends) but not on 3.10, and tests/test_matlab_bridge_completeness.py
    # imports it at module load. Making it explicit here keeps the 3.10 test
    # job from failing at collection.
    "pyyaml>=6.0",
    "tifffile>=2021.7.2",
]
formats = [
    # ndr.format.stereoseq.readGEF reads Stereo-seq .gef files, which are HDF5.
    "h5py>=3.0",
    "pyabf>=2.3.0",
    "neo>=0.12.0",
    "tdt>=0.5.0",
    "tifffile>=2021.7.2",
    "scipy>=1.7.0",
    # ndr.format.omezarr uses the zarr library so we do not need to
    # hand-roll chunk reading or Blosc/Zstd decoding.
    "zarr>=2.13",
    "numcodecs>=0.10",
]
# CED Spike2 support runs out of process through the sonpipe CLI, which pulls
# CED's sonpy binding as its own dependency. Not in the base install because
# CED pins sonpy to specific interpreter builds (CPython 3.14 on Linux at the
# time of writing) and the wheel is a vendor drop, not on PyPI; declaring it
# unconditionally would put every install of ndr behind a second repository
# and a narrow Python. Opt in with `pip install ndr[ced]`, or run
# `python -m ndr.setup.sonpipe` after installing ndr -- both land on the same
# git URL. Without either the CED reader raises SonpipeNotFoundError.
ced = ["sonpipe @ git+https://github.com/VH-Lab/sonpipe.git"]

[tool.hatch.metadata]
# The [ced] extra points at sonpipe's git URL; PEP 508 direct references
# need this opt-in to appear in optional-dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ndr"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/ndr/test"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --ignore=tests/symmetry"
markers = [
    "slow: marks tests as slow",
    "symmetry: marks cross-language symmetry tests",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B905", "E402", "B017", "B028"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "UP035"]
