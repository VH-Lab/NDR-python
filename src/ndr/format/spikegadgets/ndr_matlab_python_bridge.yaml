project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"


  # Index-base note, and one deliberate divergence.
  #
  # The .rec packet stream starts on the line after '</Configuration>'.
  # NDR-matlab finds that offset with strfind(...) + 16; strfind is 1-based, so
  # it lands on the first packet byte and has always been correct. The Python
  # port applied the same + 16 to bytes.find, which is 0-based, and landed on
  # the line terminator -- shifting every read one byte and assembling each
  # int16 from two different samples. Fixed in
  # ndr/format/spikegadgets/read_rec_configsize.py, which has no MATLAB
  # counterpart because MATLAB needs no fix.
  #
  # Divergence: that helper consumes the terminator explicitly (LF, CRLF, or
  # none) rather than assuming a single byte. It agrees with MATLAB on every
  # file Trodes writes; it additionally stays correct on a CRLF-terminated or
  # unterminated header, where MATLAB's fixed offset would be off by one.
  # Deliberately not mirrored into MATLAB: no such file is known to exist, and
  # that reader is long-standing production code.

functions:
  - name: copy_rec_files
    matlab_path: "+ndr/+format/+spikegadgets/copy_rec_files.m"
    python_path: "ndr/format/spikegadgets/copy_rec_files.py"
    matlab_last_sync_hash: "f78c56e"
    input_arguments:
      - name: filename_in
        type_python: "str | Path"
      - name: s0
        type_python: "int"
      - name: s1
        type_python: "int"
      - name: filename_out
        type_python: "str | Path"
    output_arguments: []

  - name: read_rec_analogChannels
    matlab_path: "+ndr/+format/+spikegadgets/read_rec_analogChannels.m"
    python_path: "ndr/format/spikegadgets/read_rec_analogChannels.py"
    matlab_last_sync_hash: "ac13506"
    input_arguments:
      - name: filename
        type_python: "str | Path"
      - name: NumChannels
        type_python: "str | int"
      - name: channels
        type_python: "list[int]"
      - name: samplingRate
        type_python: "float"
      - name: headerSize
        type_python: "str | int"
      - name: s0
        type_python: "int"
      - name: s1
        type_python: "int"
      - name: configExists
        type_python: "bool"
    output_arguments:
      - name: recData
        type_python: "numpy.ndarray"
      - name: timestamps
        type_python: "numpy.ndarray"
    decision_log: >-
      A .rec sample is [header][4-byte uint32 timestamp][channel data], so the
      per-sample stride is headerSizeBytes + 4 + channelSizeBytes. MATLAB's
      blockSizeBytes is 2 less than that on purpose: it is the skip argument to
      fread, which advances after reading 2 bytes. Porting that name over as a
      total stride left every Python read 2 bytes short per sample, and using
      it for the seek to s0 was wrong in both languages. Both ports now keep a
      separate stride constant for sample-boundary seeks and reserve
      blockSizeBytes for the fread skip. Paired in NDR-matlab ac13506;
      timestamps are returned for the requested span in both ports.

  - name: read_rec_config
    matlab_path: "+ndr/+format/+spikegadgets/read_rec_config.m"
    python_path: "ndr/format/spikegadgets/read_rec_config.py"
    matlab_last_sync_hash: "ac13506"
    input_arguments:
      - name: filename
        type_python: "str | Path"
    output_arguments:
      - name: config
        type_python: "dict"
      - name: channels
        type_python: "list[dict]"
    decision_log: >-
      The Python port parses the configuration XML from memory. MATLAB used to
      round-trip it through a predictably named temp file in a shared
      directory; NDR-matlab ac13506 switched it to an org.xml.sax.InputSource,
      so neither port touches disk. read_rec_config returns a (config,
      channels) tuple in Python, mirroring MATLAB's two output arguments.

  - name: read_rec_digitalChannels
    matlab_path: "+ndr/+format/+spikegadgets/read_rec_digitalChannels.m"
    python_path: "ndr/format/spikegadgets/read_rec_digitalChannels.py"
    matlab_last_sync_hash: "ac13506"
    input_arguments:
      - name: filename
        type_python: "str | Path"
      - name: NumChannels
        type_python: "str | int"
      - name: channels
        type_python: "numpy.ndarray | list"
      - name: samplingRate
        type_python: "float"
      - name: headerSize
        type_python: "str | int"
      - name: s0
        type_python: "int"
      - name: s1
        type_python: "int"
      - name: configExists
        type_python: "bool"
    output_arguments:
      - name: recData
        type_python: "numpy.ndarray"
      - name: timestamps
        type_python: "numpy.ndarray"
    decision_log: >-
      A .rec sample is [header][4-byte uint32 timestamp][channel data], so the
      per-sample stride is headerSizeBytes + 4 + channelSizeBytes. MATLAB's
      blockSizeBytes is 2 less than that on purpose: it is the skip argument to
      fread, which advances after reading 2 bytes. Porting that name over as a
      total stride left every Python read 2 bytes short per sample, and using
      it for the seek to s0 was wrong in both languages. Both ports now keep a
      separate stride constant for sample-boundary seeks and reserve
      blockSizeBytes for the fread skip. Paired in NDR-matlab ac13506;
      timestamps are returned for the requested span in both ports.

  - name: read_rec_configsize
    matlab_path: "+ndr/+format/+spikegadgets/read_rec_configsize.m"
    python_path: "ndr/format/spikegadgets/read_rec_configsize.py"
    matlab_last_sync_hash: "c2f6e34"
    input_arguments:
      - name: filename
        type_python: "str | Path"
    output_arguments:
      - name: configSize
        type_python: "int"
    decision_log: >-
      Returns the byte offset of the first packet after '</Configuration>'.
      Landed in NDR-matlab c2f6e34 alongside the .vlh eval removal. The
      Python port consumes the LF/CRLF/none terminator explicitly rather
      than the fixed + 2 MATLAB uses (see the divergence note at the top
      of this file); MATLAB's fixed offset is correct on every Trodes file
      but off by one on any hand-written CRLF header.

  - name: read_rec_trodeChannels
    matlab_path: "+ndr/+format/+spikegadgets/read_rec_trodeChannels.m"
    python_path: "ndr/format/spikegadgets/read_rec_trodeChannels.py"
    matlab_last_sync_hash: "ac13506"
    input_arguments:
      - name: filename
        type_python: "str | Path"
      - name: NumChannels
        type_python: "str | int"
      - name: channels
        type_python: "list[int]"
      - name: samplingRate
        type_python: "float"
      - name: headerSize
        type_python: "str | int"
      - name: s0
        type_python: "int"
      - name: s1
        type_python: "int"
    output_arguments:
      - name: recData
        type_python: "numpy.ndarray"
      - name: timestamps
        type_python: "numpy.ndarray"
    decision_log: >-
      A .rec sample is [header][4-byte uint32 timestamp][channel data], so the
      per-sample stride is headerSizeBytes + 4 + channelSizeBytes. MATLAB's
      blockSizeBytes is 2 less than that on purpose: it is the skip argument to
      fread, which advances after reading 2 bytes. Porting that name over as a
      total stride left every Python read 2 bytes short per sample, and using
      it for the seek to s0 was wrong in both languages. Both ports now keep a
      separate stride constant for sample-boundary seeks and reserve
      blockSizeBytes for the fread skip. Paired in NDR-matlab ac13506;
      timestamps are returned for the requested span in both ports.
