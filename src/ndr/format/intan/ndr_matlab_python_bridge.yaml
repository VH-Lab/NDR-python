project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

functions:
  - name: read_Intan_RHD2000_header
    matlab_path: "+ndr/+format/+intan/read_Intan_RHD2000_header.m"
    status: regular_port
    python_path: "ndr/format/intan/read_Intan_RHD2000_header.py"
    matlab_last_sync_hash: "a938988"
    decision_log: >
      Multi-file support (NDR-matlab 034f210) and its 'detect' default
      (a938988) are ported: fileMode parameter, aggregation across the file
      set, and header['fileinfo']['multifile']. This entry's hash was written
      by the 6377973 backfill before any of that existed (see issue #23); it
      is now a claim someone has actually checked. fileinfo here carries only
      filesize, headersize and multifile -- MATLAB's also repeats version
      numbers and notes, which this port already exposes at the top level of
      header.
    input_arguments:
      - name: filename
        type_python: "str | Path"
    output_arguments:
      - name: header
        type_python: "dict"

  - name: read_Intan_RHD2000_datafile
    matlab_path: "+ndr/+format/+intan/read_Intan_RHD2000_datafile.m"
    status: regular_port
    python_path: "ndr/format/intan/read_Intan_RHD2000_datafile.py"
    matlab_last_sync_hash: "cae4b00"
    decision_log: >
      Dispatches a request across the constituent files of a multi-file
      recording and concatenates, so the set reads as one continuous stream
      (NDR-matlab 034f210/a938988). Hash was backfilled by 6377973 (issue
      #23); now genuinely examined.
    input_arguments:
      - name: filename
        type_python: "str | Path"
      - name: header_filename
        type_python: "str"
      - name: channeltype
        type_python: "str"
      - name: channel
        type_python: "int | list[int]"
      - name: t0
        type_python: "float"
      - name: t1
        type_python: "float"
    output_arguments:
      - name: data
        type_python: "numpy.ndarray"

  - name: Intan_RHD2000_blockinfo
    matlab_path: "+ndr/+format/+intan/Intan_RHD2000_blockinfo.m"
    status: regular_port
    python_path: "ndr/format/intan/read_Intan_RHD2000_datafile.py"
    matlab_last_sync_hash: "a938988"
    decision_log: >
      Returns per-file block counts as a fifth value (file_blocks) and sums
      bytes and blocks across a multi-file set, as MATLAB does. Also restores
      MATLAB's truncation warning, which this port had silently dropped. Hash
      was backfilled by 6377973 before the multi-file work existed (issue
      #23); now genuinely examined.
    input_arguments:
      - name: filename
        type_python: "str | Path"
      - name: header
        type_python: "dict"
    output_arguments:
      - name: blockinfo
        type_python: "dict"
      - name: bytes_per_block
        type_python: "int"
      - name: bytes_present
        type_python: "int"
      - name: num_data_blocks
        type_python: "int"

  - name: fread_QString
    matlab_path: "+ndr/+format/+intan/fread_QString.m"
    status: regular_port
    python_path: "ndr/format/intan/fread_QString.py"
    matlab_last_sync_hash: "94c5232"
    input_arguments:
      - name: fid
        type_python: "file-like"
    output_arguments:
      - name: a
        type_python: "str"

  - name: read_Intan_RHD2000_directory
    matlab_path: "+ndr/+format/+intan/read_Intan_RHD2000_directory.m"
    status: regular_port
    python_path: "ndr/format/intan/read_Intan_RHD2000_directory.py"
    matlab_last_sync_hash: "b461bf6"
    decision_log: >
      Adds "one file per signal type" support alongside the existing
      "one file per channel" path (NDR-matlab #138). Layout is detected
      from a *amplifier.dat probe; on hit the reader dispatches to
      read_IntanRHD2000_one_file_per_channel_type and, for digital
      channels, extracts each requested channel's bit from the packed
      16-bit word using its native_order. info.rhd and time.dat are
      resolved through a local fixdatfilename helper so a lab or Intan
      timestamp prefix (e.g., "febc0_u000_000_") still matches.
    input_arguments:
      - name: directoryname
        type_python: "str | Path"
      - name: header
        type_python: "dict | None"
      - name: channel_type
        type_python: "str | int"
      - name: channel_numbers
        type_python: "int | list[int]"
      - name: t0
        type_python: "float"
      - name: t1
        type_python: "float"
    output_arguments:
      - name: data
        type_python: "numpy.ndarray"
      - name: total_samples
        type_python: "int"
      - name: total_time
        type_python: "float"

  - name: read_IntanRHD2000_one_file_per_channel_type
    matlab_path: "+ndr/+format/+intan/read_IntanRHD2000_one_file_per_channel_type.m"
    status: regular_port
    python_path: "ndr/format/intan/read_IntanRHD2000_one_file_per_channel_type.py"
    matlab_last_sync_hash: "b461bf6"
    decision_log: >
      New helper introduced in NDR-matlab #138 that reads one interleaved
      signal-type file at a time from the Intan "one file per signal type"
      layout, resolving optional filename prefixes and returning the raw
      packed 16-bit word for digital channels (the caller extracts the bit).
    input_arguments:
      - name: directory_name
        type_python: "str | Path"
      - name: channel_type
        type_python: "int"
      - name: channel_index
        type_python: "int"
      - name: num_channels
        type_python: "int"
      - name: s0
        type_python: "int"
      - name: s1
        type_python: "int"
    output_arguments:
      - name: data
        type_python: "numpy.ndarray"

  - name: cat_Intan_RHD2000_files
    matlab_path: "+ndr/+format/+intan/cat_Intan_RHD2000_files.m"
    status: regular_port
    python_path: "ndr/format/intan/cat_Intan_RHD2000_files.py"
    matlab_last_sync_hash: "ba074d4"
    input_arguments:
      - name: filenames
        type_python: "str | Path (variadic)"
    output_arguments:
      - name: status
        type_python: "int"

  - name: concat_rhd_files
    matlab_path: "+ndr/+format/+intan/concat_rhd_files.m"
    status: regular_port
    python_path: "ndr/format/intan/concat_rhd_files.py"
    matlab_last_sync_hash: "9125d98"
    input_arguments:
      - name: dirname
        type_python: "str | Path"
    output_arguments: []

  - name: copy_Intan_RHD2000_blocks
    matlab_path: "+ndr/+format/+intan/copy_Intan_RHD2000_blocks.m"
    status: regular_port
    python_path: "ndr/format/intan/copy_Intan_RHD2000_blocks.py"
    matlab_last_sync_hash: "24cfef8"
    input_arguments:
      - name: filename_in
        type_python: "str | Path"
      - name: b1
        type_python: "int"
      - name: b2
        type_python: "int"
      - name: filename_out
        type_python: "str | Path"
    output_arguments:
      - name: status
        type_python: "int"

  - name: detectRHD2000FileMode
    matlab_path: "+ndr/+format/+intan/detectRHD2000FileMode.m"
    status: regular_port
    python_path: "ndr/format/intan/detectRHD2000FileMode.py"
    matlab_last_sync_hash: "a938988"

  - name: getRHD2000FileList
    matlab_path: "+ndr/+format/+intan/getRHD2000FileList.m"
    status: regular_port
    python_path: "ndr/format/intan/getRHD2000FileList.py"
    matlab_last_sync_hash: "a938988"
    decision_log: >
      Mirrors MATLAB's sort key exactly: the concatenated YYMMDD+HHMMSS
      string, which is lexicographic on a two-digit year and so orders
      correctly within a century but not across 99 -> 00. Kept rather than
      corrected, because MATLAB is the source of truth and fixing one side
      would put the two languages out of step on the same directory.

# ---------------------------------------------------------------------------
# The +manufacturer subpackage: Intan's stock demo reader, vendored so the
# Python readers can validate against it byte-for-byte. Python has parallel
# modules under ndr/format/intan/manufacturer/.
# ---------------------------------------------------------------------------

manufacturer:
  - name: read_Intan_RHD2000_file
    matlab_path: "+ndr/+format/+intan/+manufacturer/read_Intan_RHD2000_file.m"
    status: regular_port
    python_path: "ndr/format/intan/manufacturer/read_Intan_RHD2000_file.py"
    matlab_last_sync_hash: "d78c7ea"
    decision_log: >
      Vendored Intan demo reader that loads the entire file into MATLAB
      workspace variables. Python mirror lives at the parallel path and
      loads into a dict of numpy arrays instead.

  - name: read_Intan_RHD2000_file_var
    matlab_path: "+ndr/+format/+intan/+manufacturer/read_Intan_RHD2000_file_var.m"
    status: regular_port
    python_path: "ndr/format/intan/manufacturer/read_Intan_RHD2000_file_var.py"
    matlab_last_sync_hash: "d78c7ea"
    decision_log: >
      Variable-argument variant of the vendored Intan demo reader. Python
      mirror at the parallel path.

  - name: upsample2x
    matlab_path: "+ndr/+format/+intan/+manufacturer/upsample2x.m"
    status: regular_port
    python_path: "ndr/format/intan/manufacturer/upsample2x.py"
    matlab_last_sync_hash: "d78c7ea"
    decision_log: >
      2x FIR-filter upsampler used by the Intan demo reader. Straight port
      to numpy; the FIR coefficients are lifted from the MATLAB source.
