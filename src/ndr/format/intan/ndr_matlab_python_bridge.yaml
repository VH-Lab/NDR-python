project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

functions:
  - name: read_Intan_RHD2000_header
    matlab_path: "+ndr/+format/+intan/read_Intan_RHD2000_header.m"
    python_path: "ndr/format/intan/read_Intan_RHD2000_header.py"
    matlab_last_sync_hash: "a938988"
    input_arguments:
      - name: filename
        type_python: "str | Path"
    output_arguments:
      - name: header
        type_python: "dict"

  - name: read_Intan_RHD2000_datafile
    matlab_path: "+ndr/+format/+intan/read_Intan_RHD2000_datafile.m"
    python_path: "ndr/format/intan/read_Intan_RHD2000_datafile.py"
    matlab_last_sync_hash: "cae4b00"
    input_arguments:
      - name: filename
        type_python: "str | Path"
      - name: header_filename
        type_python: "str"
      - name: channeltype
        type_python: "str"
      - name: channel
        type_python: "int | list[int]"
      - name: t0
        type_python: "float"
      - name: t1
        type_python: "float"
    output_arguments:
      - name: data
        type_python: "numpy.ndarray"

  - name: Intan_RHD2000_blockinfo
    matlab_path: "+ndr/+format/+intan/Intan_RHD2000_blockinfo.m"
    python_path: "ndr/format/intan/read_Intan_RHD2000_datafile.py"
    matlab_last_sync_hash: "a938988"
    input_arguments:
      - name: filename
        type_python: "str | Path"
      - name: header
        type_python: "dict"
    output_arguments:
      - name: blockinfo
        type_python: "dict"
      - name: bytes_per_block
        type_python: "int"
      - name: bytes_present
        type_python: "int"
      - name: num_data_blocks
        type_python: "int"

  - name: fread_QString
    matlab_path: "+ndr/+format/+intan/fread_QString.m"
    python_path: "ndr/format/intan/fread_QString.py"
    matlab_last_sync_hash: "f78c56e"
    input_arguments:
      - name: fid
        type_python: "file-like"
    output_arguments:
      - name: a
        type_python: "str"

  - name: read_Intan_RHD2000_directory
    matlab_path: "+ndr/+format/+intan/read_Intan_RHD2000_directory.m"
    python_path: "ndr/format/intan/read_Intan_RHD2000_directory.py"
    matlab_last_sync_hash: "cae4b00"
    input_arguments:
      - name: directoryname
        type_python: "str | Path"
      - name: header
        type_python: "dict | None"
      - name: channel_type
        type_python: "str | int"
      - name: channel_numbers
        type_python: "int | list[int]"
      - name: t0
        type_python: "float"
      - name: t1
        type_python: "float"
    output_arguments:
      - name: data
        type_python: "numpy.ndarray"
      - name: total_samples
        type_python: "int"
      - name: total_time
        type_python: "float"

  - name: cat_Intan_RHD2000_files
    matlab_path: "+ndr/+format/+intan/cat_Intan_RHD2000_files.m"
    python_path: "ndr/format/intan/cat_Intan_RHD2000_files.py"
    matlab_last_sync_hash: "f78c56e"
    input_arguments:
      - name: filenames
        type_python: "str | Path (variadic)"
    output_arguments:
      - name: status
        type_python: "int"

  - name: concat_rhd_files
    matlab_path: "+ndr/+format/+intan/concat_rhd_files.m"
    python_path: "ndr/format/intan/concat_rhd_files.py"
    matlab_last_sync_hash: "f78c56e"
    input_arguments:
      - name: dirname
        type_python: "str | Path"
    output_arguments: []

  - name: copy_Intan_RHD2000_blocks
    matlab_path: "+ndr/+format/+intan/copy_Intan_RHD2000_blocks.m"
    python_path: "ndr/format/intan/copy_Intan_RHD2000_blocks.py"
    matlab_last_sync_hash: "f78c56e"
    input_arguments:
      - name: filename_in
        type_python: "str | Path"
      - name: b1
        type_python: "int"
      - name: b2
        type_python: "int"
      - name: filename_out
        type_python: "str | Path"
    output_arguments:
      - name: status
        type_python: "int"

  - name: detectRHD2000FileMode
    matlab_path: "+ndr/+format/+intan/detectRHD2000FileMode.m"
    matlab_last_sync_hash: "a938988"
    status: not_yet_ported
    decision_log: >
      Detects whether an .rhd filename follows the Intan
      '<prefix>_<YYMMDD>_<HHMMSS>.rhd' multi-file convention. Not yet ported:
      the Python side currently reads .rhd files individually and does not
      auto-assemble multi-file recordings. Landed in NDR-matlab a938988
      (2026-05-06). Port when a multi-file dataset needs Python coverage.

  - name: getRHD2000FileList
    matlab_path: "+ndr/+format/+intan/getRHD2000FileList.m"
    matlab_last_sync_hash: "a938988"
    status: not_yet_ported
    decision_log: >
      Companion to detectRHD2000FileMode: returns the sorted list of .rhd
      files that make up a recording. Same porting status: waits until a
      Python caller needs multi-file assembly. Landed in NDR-matlab a938988
      (2026-05-06).

# ---------------------------------------------------------------------------
# The +manufacturer subpackage: Intan's stock demo reader, vendored so the
# Python readers can validate against it byte-for-byte. Python has parallel
# modules under ndr/format/intan/manufacturer/.
# ---------------------------------------------------------------------------

manufacturer:
  - name: read_Intan_RHD2000_file
    matlab_path: "+ndr/+format/+intan/+manufacturer/read_Intan_RHD2000_file.m"
    python_path: "ndr/format/intan/manufacturer/read_Intan_RHD2000_file.py"
    matlab_last_sync_hash: "f78c56e"
    decision_log: >
      Vendored Intan demo reader that loads the entire file into MATLAB
      workspace variables. Python mirror lives at the parallel path and
      loads into a dict of numpy arrays instead.

  - name: read_Intan_RHD2000_file_var
    matlab_path: "+ndr/+format/+intan/+manufacturer/read_Intan_RHD2000_file_var.m"
    python_path: "ndr/format/intan/manufacturer/read_Intan_RHD2000_file_var.py"
    matlab_last_sync_hash: "f78c56e"
    decision_log: >
      Variable-argument variant of the vendored Intan demo reader. Python
      mirror at the parallel path.

  - name: upsample2x
    matlab_path: "+ndr/+format/+intan/+manufacturer/upsample2x.m"
    python_path: "ndr/format/intan/manufacturer/upsample2x.py"
    matlab_last_sync_hash: "f78c56e"
    decision_log: >
      2x FIR-filter upsampler used by the Intan demo reader. Straight port
      to numpy; the FIR coefficients are lifted from the MATLAB source.
