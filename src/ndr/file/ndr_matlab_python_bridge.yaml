project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

# Contract recorded 2026-08-27. The Python implementation of this sub-package
# predated its bridge file.
#
# Not ported: +ndr/+file/fileobj.m. It wraps MATLAB's fopen/fread file-handle
# semantics (byte order, machine format, seek modes) for which Python uses
# built-in file objects plus numpy dtypes directly; the Python format readers
# open files themselves rather than going through a fileobj shim.

functions:
  - name: textfile2char
    type: function
    matlab_path: "+ndr/+file/textfile2char.m"
    python_path: "ndr/file/textfile2char.py"
    matlab_last_sync_hash: "20743f7"
    input_arguments:
      - name: filename
        type_matlab: "char"
        type_python: "str | Path"
    output_arguments:
      - name: t
        type_matlab: "char"
        type_python: "str"
