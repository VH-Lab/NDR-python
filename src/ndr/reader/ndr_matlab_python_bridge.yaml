  - name: tiffstack
    type: class
    matlab_path: "+ndr/+reader/tiffstack.m"
    python_path: "ndr/reader/tiffstack.py"
    matlab_last_sync_hash: "a2ffd8b"
    python_class: "ndr_reader_tiffstack"
    inherits: base
    decision_log: >-
      Ported 2026-08-28. Native multipage-TIFF image reader; implements the
      frame API rather than the channel API. MATLAB uses imfinfo/imread;
      the Python port uses tifffile (an optional dependency, imported lazily
      so it is only required when a TIFF is actually read). MATLAB's
      tiffclass derives the class from BitsPerSample plus SampleFormat;
      tifffile already resolves each page to a numpy dtype, so the Python
      tiffclass returns that dtype's name.
    methods:
      - name: imagefiles
        input_arguments:
          - name: epochstreams
            type_python: "list[str] | str"
        output_arguments:
          - name: files
            type_python: "list[str]"
      - name: tiffsindir
        input_arguments:
          - name: folder
            type_python: "str | Path"
        output_arguments:
          - name: files
            type_python: "list[str]"
      - name: filenamefromepochfiles
        input_arguments:
          - name: filename_array
            type_python: "list[str]"
        output_arguments:
          - name: filename
            type_python: "str"
      - name: resolveepoch
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: info
            type_matlab: "struct"
            type_python: "dict[str, Any]"
      - name: framesource
        input_arguments:
          - name: info
            type_python: "dict[str, Any]"
          - name: frameidx
            type_python: "int"
        output_arguments:
          - name: filename
            type_python: "str"
          - name: page
            type_python: "int"
        decision_log: "Semantic Parity: frameidx and the returned page are 1-based."
      - name: numframes
      - name: framesize
      - name: dimensionorder
      - name: datatype
      - name: frametimes
      - name: readframes
      - name: metadata
      - name: frametimesfilename
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: frametimesfile
            type_python: "str"
      - name: hasframetimes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: b
            type_python: "bool"
      - name: epochclock
      - name: t0_t1
      - name: getchannelsepoch
    static_methods:
      - name: tiffclass
        input_arguments:
          - name: fi
            type_matlab: "struct (imfinfo output)"
            type_python: "dict[str, Any]"
        output_arguments:
          - name: dt
            type_matlab: "char"
            type_python: "str"
        decision_log: "Returns the MATLAB class name in both ports."
      - name: numpy_dtype
        input_arguments:
          - name: matlab_class
            type_python: "str"
        output_arguments:
          - name: dtype
            type_python: "numpy.dtype"
        decision_log: >-
          Python-only inverse of tiffclass, converting the reported MATLAB
          class name into the numpy dtype used to allocate frame arrays. No
          MATLAB counterpart is needed because MATLAB's class names are
          already its allocation types.

  - name: omezarr
    type: class
    matlab_path: "+ndr/+reader/omezarr.m"
    python_path: "ndr/reader/omezarr.py"
    matlab_last_sync_hash: "b65d919"
    python_class: "ndr_reader_omezarr"
    inherits: base
    decision_log: >-
      Ported 2026-09-06. Native OME-Zarr (NGFF v0.4) image reader; sibling
      of tiffstack, implements the frame API only. Pixel reads delegate
      to ndr.format.omezarr.readArray, which uses Python's `zarr` library
      (an optional dependency, imported lazily). The MATLAB reader's
      hand-rolled Blosc/Zstd chunk-reader is not needed here because
      the zarr library handles every codec and byte order the MATLAB
      side supports (and more) natively.

      Epochstream shape mirrors MATLAB's cell array: either a str path
      (which errors with the pyramid list because pyramid selection has
      no default -- see issue #127), or a list containing a
      [zarrPath, pyramidName] 2-list, or a flat [zarrPath, pyramidName]
      when the second element is unambiguously a pyramid name.
    methods:
      - name: resolveepoch
        input_arguments:
          - name: epochstreams
            type_python: "list | str"
        output_arguments:
          - name: info
            type_matlab: "struct"
            type_python: "dict[str, Any]"
      - name: numframes
      - name: framesize
      - name: dimensionorder
      - name: datatype
      - name: frametimes
      - name: readframes
        input_arguments:
          - name: epochstreams
            type_python: "list | str"
          - name: epoch_select
            type_python: "int"
          - name: frameind
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: "Semantic Parity: frame indices are 1-based."
          - name: Level
            type_python: "int"
            decision_log: >-
              MATLAB name/value pair; Python keyword-only argument.
              1-based; default 1 (highest resolution).
          - name: SelectC
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: >-
              MATLAB name/value pair; Python keyword-only argument.
              1-based; None (MATLAB []) keeps every channel.
          - name: SelectZ
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: >-
              MATLAB name/value pair; Python keyword-only argument.
              1-based; None (MATLAB []) keeps every plane.
        output_arguments:
          - name: frames
            type_python: "numpy.ndarray"
      - name: epochclock
      - name: t0_t1
      - name: getchannelsepoch
    static_methods:
      - name: parseEpochstreams
        input_arguments:
          - name: epochstreams
            type_python: "list | str"
        output_arguments:
          - name: zarrPath
            type_python: "str"
          - name: pyramidName
            type_python: "str"
      - name: classifyAxes
        input_arguments:
          - name: axes
            type_python: "list[dict[str, str]]"
        output_arguments:
          - name: axisIndex
            type_matlab: "struct"
            type_python: "dict[str, Any]"
      - name: axisSize
        input_arguments:
          - name: shape
            type_python: "list[int]"
          - name: idx
            type_python: "int | float"
          - name: fallback
            type_python: "int"
        output_arguments:
          - name: s
            type_python: "int"
      - name: zarrClass
        input_arguments:
          - name: dtypeStr
            type_python: "str"
        output_arguments:
          - name: dt
            type_python: "str"
        decision_log: "Returns the MATLAB class name (single/double for floats)."
      - name: numpy_dtype
        input_arguments:
          - name: matlab_class
            type_python: "str"
        output_arguments:
          - name: dtype
            type_python: "numpy.dtype"
        decision_log: >-
          Python-only inverse of zarrClass, converting the reported MATLAB
          class name into the numpy dtype used to allocate frame arrays.
      - name: formatNameList
        input_arguments:
          - name: names
            type_python: "list[str]"
        output_arguments:
          - name: s
            type_python: "str"
      - name: arrangePlaneYXC
        input_arguments:
          - name: plane
            type_python: "numpy.ndarray"
          - name: axisIndex
            type_python: "dict[str, Any]"
          - name: Y
            type_python: "int"
          - name: X
            type_python: "int"
          - name: C
            type_python: "int"
        output_arguments:
          - name: planeYXC
            type_python: "numpy.ndarray"

  - name: smartspim
