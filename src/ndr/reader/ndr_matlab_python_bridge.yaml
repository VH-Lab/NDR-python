            type_python: "str"
      - name: daqchannels2internalchannels
        input_arguments:
          - name: channelprefix
            type_python: "list[str]"
          - name: channelnumber
            type_python: "list[int]"
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: channelstruct
            type_python: "list[dict]"
      - name: epochclock
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: ec
            type_python: "list[ClockType]"
      - name: getchannelsepoch
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: channels
            type_python: "list[dict]"
      - name: channelLabelingConvention
        input_arguments:
          - name: channeltype
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: convention
            type_matlab: "char"
            type_python: "str"
        decision_log: >-
          Ported from MATLAB b2e9d95/3974d59 on 2026-08-27. Declares how a
          reader names channels: 'indexed' (base default), 'physical', or
          'native'. MATLAB name kept verbatim per Strict MATLAB Mirror, so
          this method is camelCase where the rest of the API is lowercase.
      - name: numframes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: n
            type_python: "int"
      - name: framesize
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: sz
            type_matlab: "1x5 double"
            type_python: "list[int]"
            decision_log: "[Y X C Z T] extent."
      - name: dimensionorder
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: order
            type_python: "str"
      - name: datatype
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: dt
            type_matlab: "char"
            type_python: "str"
        decision_log: >-
          Strict string parity: both ports return the MATLAB numeric class
          name, so 'single'/'double' (not numpy's 'float32'/'float64') and the
          integer names, which are spelled identically. Python callers convert
          with ndr_reader_tiffstack.numpy_dtype().
      - name: frametimes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: frameind
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: "Semantic Parity: frame indices are 1-based."
        output_arguments:
          - name: t
            type_python: "numpy.ndarray"
      - name: readframes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: frameind
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: "Semantic Parity: frame indices are 1-based."
          - name: SelectC
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: >-
              MATLAB name/value pair; Python keyword-only argument. 1-based;
              None (MATLAB []) keeps every channel.
          - name: SelectZ
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: >-
              MATLAB name/value pair; Python keyword-only argument. 1-based;
              None (MATLAB []) keeps every plane.
        output_arguments:
          - name: frames
            type_python: "numpy.ndarray"
      - name: metadata
