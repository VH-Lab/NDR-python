            type_python: "int"
          - name: frameind
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: "Semantic Parity: frame indices are 1-based."
          - name: SelectC
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: "MATLAB name/value pair; Python keyword-only argument."
          - name: SelectZ
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: "MATLAB name/value pair; Python keyword-only argument."
        output_arguments:
