            type_matlab: "char"
            type_python: "str"
        decision_log: >-
          Ported from MATLAB b2e9d95/3974d59 on 2026-08-27. Declares how a
          reader names channels: 'indexed' (base default), 'physical', or
          'native'. MATLAB name kept verbatim per Strict MATLAB Mirror, so
          this method is camelCase where the rest of the API is lowercase.
      - name: underlying_datatype
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
        output_arguments:
          - name: datatype
            type_python: "str"
          - name: p
            type_python: "numpy.ndarray"
          - name: datasize
            type_python: "int"
      - name: readchannels_epochsamples
        input_arguments:
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: s0
            type_python: "int"
          - name: s1
            type_python: "int"
        output_arguments:
          - name: data
            type_python: "numpy.ndarray"
      - name: readevents_epochsamples_native
        input_arguments:
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: t0
            type_python: "float"
          - name: t1
            type_python: "float"
        output_arguments:
          - name: timestamps
            type_python: "numpy.ndarray"
          - name: data
            type_python: "numpy.ndarray"
      - name: samplerate
        input_arguments:
