  - name: imagestack
    type: class
    matlab_path: "+ndr/+reader/imagestack.m"
    matlab_last_sync_hash: "64d06e4"
    status: not_applicable
    decision_log: >
      MATLAB reader that delegates to NANSEN's nansen.stack.ImageStack
      (VervaekeLab). NANSEN is a MATLAB-only library with no Python
      equivalent, so there is nothing to delegate to on this side. NDR-python
      covers the same image-stack formats through native readers
      (ndr.reader.tiffstack, ndr.reader.omezarr, ndr.reader.smartspim,
      ndr.reader.prairieview), so an imagestack-shaped wrapper would add no
      coverage and none is planned.
