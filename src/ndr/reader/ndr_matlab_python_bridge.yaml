  - name: tiffstack
    type: class
    matlab_path: "+ndr/+reader/tiffstack.m"
    python_path: "ndr/reader/tiffstack.py"
    matlab_last_sync_hash: "a2ffd8b"
    python_class: "ndr_reader_tiffstack"
    inherits: base
    decision_log: >-
      Ported 2026-08-28. Native multipage-TIFF image reader; implements the
      frame API rather than the channel API. MATLAB uses imfinfo/imread;
      the Python port uses tifffile (an optional dependency, imported lazily
      so it is only required when a TIFF is actually read). MATLAB's
      tiffclass derives the class from BitsPerSample plus SampleFormat;
      tifffile already resolves each page to a numpy dtype, so the Python
      tiffclass returns that dtype's name.
    methods:
      - name: imagefiles
        input_arguments:
          - name: epochstreams
            type_python: "list[str] | str"
        output_arguments:
          - name: files
            type_python: "list[str]"
      - name: tiffsindir
        input_arguments:
          - name: folder
            type_python: "str | Path"
        output_arguments:
          - name: files
            type_python: "list[str]"
      - name: filenamefromepochfiles
        input_arguments:
          - name: filename_array
            type_python: "list[str]"
        output_arguments:
          - name: filename
            type_python: "str"
      - name: resolveepoch
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: info
            type_matlab: "struct"
            type_python: "dict[str, Any]"
      - name: framesource
        input_arguments:
          - name: info
            type_python: "dict[str, Any]"
          - name: frameidx
            type_python: "int"
        output_arguments:
          - name: filename
            type_python: "str"
          - name: page
            type_python: "int"
        decision_log: "Semantic Parity: frameidx and the returned page are 1-based."
      - name: numframes
      - name: framesize
      - name: dimensionorder
      - name: datatype
      - name: frametimes
      - name: readframes
      - name: metadata
      - name: frametimesfilename
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: frametimesfile
            type_python: "str"
      - name: hasframetimes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: b
            type_python: "bool"
      - name: epochclock
      - name: t0_t1
      - name: getchannelsepoch
    static_methods:
      - name: tiffclass
        input_arguments:
          - name: fi
            type_matlab: "struct (imfinfo output)"
            type_python: "dict[str, Any]"
        output_arguments:
          - name: dt
            type_python: "str"

  - name: prairieview
    type: class
    matlab_path: "+ndr/+reader/prairieview.m"
    python_path: "ndr/reader/prairieview.py"
    matlab_last_sync_hash: "64d06e4"
    python_class: "ndr_reader_prairieview"
    inherits: tiffstack
    decision_log: >-
      Ported 2026-08-28. Native legacy Prairie View reader; inherits the TIFF
      machinery from tiffstack and adds multi-channel file grouping (parsed
      from Cycle/Ch markers in the file names), real per-frame timestamps
      from the config, and raster-scan metadata. Uses no NANSEN code or
      dependency.
    methods:
      - name: framelayout
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: L
            type_matlab: "struct"
            type_python: "dict[str, Any]"
      - name: numframes
      - name: framesize
      - name: datatype
      - name: readframes
        decision_log: >-
          SelectC is honored at the source: files for unselected channels are
          never opened, so only SelectZ is post-selected via selectframeCZ.
      - name: config
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: v
            type_matlab: "struct"
            type_python: "dict[str, Any]"
      - name: hasconfigtimes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
        output_arguments:
          - name: tf
            type_python: "bool"
      - name: frametimes
      - name: epochclock
      - name: t0_t1
      - name: metadata
