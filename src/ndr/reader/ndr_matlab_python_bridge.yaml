project_metadata:
  bridge_version: "1.1"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

classes:
  - name: base
    type: class
    matlab_path: "+ndr/+reader/base.m"
    python_path: "ndr/reader/base.py"
    matlab_last_sync_hash: "64d06e4"
    python_class: "ndr_reader_base"
    properties:
      - name: MightHaveTimeGaps
        type_python: "bool"
    methods:
      - name: canbereadtogether
        input_arguments:
          - name: channelstruct
            type_python: "list[dict]"
        output_arguments:
          - name: b
            type_python: "bool"
          - name: errormsg
            type_python: "str"
      - name: daqchannels2internalchannels
        input_arguments:
          - name: channelprefix
            type_python: "list[str]"
          - name: channelnumber
            type_python: "list[int]"
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: channelstruct
            type_python: "list[dict]"
      - name: epochclock
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: ec
            type_python: "list[ClockType]"
      - name: getchannelsepoch
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: channels
            type_python: "list[dict]"
      - name: channelLabelingConvention
        input_arguments:
          - name: channeltype
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: convention
            type_matlab: "char"
            type_python: "str"
        decision_log: >-
          Ported from MATLAB b2e9d95/3974d59 on 2026-08-27. Declares how a
          reader names channels: 'indexed' (base default), 'physical', or
          'native'. MATLAB name kept verbatim per Strict MATLAB Mirror, so
          this method is camelCase where the rest of the API is lowercase.
      - name: numframes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: n
            type_python: "int"
      - name: framesize
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: sz
            type_matlab: "1x5 double"
            type_python: "list[int]"
            decision_log: "[Y X C Z T] extent."
      - name: dimensionorder
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: order
            type_python: "str"
      - name: datatype
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: dt
            type_matlab: "char"
            type_python: "str"
        decision_log: >-
          MATLAB returns a MATLAB class name ('single'/'double'); the Python
          port returns the numpy dtype name ('float32'/'float64'). Integer
          types ('uint16', 'int16') are spelled identically in both.
      - name: frametimes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: frameind
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: "Semantic Parity: frame indices are 1-based."
        output_arguments:
          - name: t
            type_python: "numpy.ndarray"
      - name: readframes
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: frameind
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: "Semantic Parity: frame indices are 1-based."
          - name: SelectC
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: >-
              MATLAB name/value pair; Python keyword-only argument. 1-based;
              None (MATLAB []) keeps every channel.
          - name: SelectZ
            type_python: "list[int] | numpy.ndarray | None"
            decision_log: >-
              MATLAB name/value pair; Python keyword-only argument. 1-based;
              None (MATLAB []) keeps every plane.
        output_arguments:
          - name: frames
            type_python: "numpy.ndarray"
      - name: metadata
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: m
            type_matlab: "struct"
            type_python: "dict[str, Any]"
      - name: underlying_datatype
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
        output_arguments:
          - name: datatype
            type_python: "str"
          - name: p
            type_python: "numpy.ndarray"
          - name: datasize
            type_python: "int"
      - name: readchannels_epochsamples
        input_arguments:
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: s0
            type_python: "int"
          - name: s1
            type_python: "int"
        output_arguments:
          - name: data
            type_python: "numpy.ndarray"
      - name: readevents_epochsamples_native
        input_arguments:
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: t0
            type_python: "float"
          - name: t1
            type_python: "float"
        output_arguments:
          - name: timestamps
            type_python: "numpy.ndarray"
          - name: data
            type_python: "numpy.ndarray"
      - name: samplerate
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
        output_arguments:
          - name: sr
            type_python: "float | numpy.ndarray"
      - name: t0_t1
        input_arguments:
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
        output_arguments:
          - name: t0t1
            type_python: "list[list[float]]"
      - name: samples2times
        input_arguments:
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: s
            type_python: "numpy.ndarray | int"
        output_arguments:
          - name: t
            type_python: "numpy.ndarray"
      - name: times2samples
        input_arguments:
          - name: channeltype
            type_python: "str"
          - name: channel
            type_python: "int | list[int]"
          - name: epochstreams
            type_python: "list[str]"
          - name: epoch_select
            type_python: "int"
          - name: t
            type_python: "numpy.ndarray | float"
        output_arguments:
          - name: s
            type_python: "numpy.ndarray"
    static_methods:
      - name: emptyimagemetadata
        output_arguments:
          - name: m
            type_matlab: "struct"
            type_python: "dict[str, Any]"
      - name: selectframeCZ
        input_arguments:
          - name: frames
            type_python: "numpy.ndarray"
          - name: SelectC
